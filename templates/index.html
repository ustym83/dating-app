<!DOCTYPE html>
<html lang="{{ g.locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Вхід або Реєстрація') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <main>
        <div class="auth-container">
            <div class="auth-box">
                <h2 id="form-title">{{ _('Вхід') }}</h2>

                <form action="/login" method="POST" id="login-form">
                    <input type="email" name="email" placeholder="{{ _('Пошта') }}" required>
                    <input type="password" name="password" placeholder="{{ _('Пароль') }}" required>
                    {% if error and form_to_show == 'login' %}
                        <p class="error-message">{{ error }}</p>
                    {% endif %}
                    <button type="submit" class="big-btn">{{ _('Увійти') }}</button>
                </form>

                <form action="/register" method="POST" id="register-form" style="display: none;">
                    <input type="email" name="email" placeholder="{{ _('Пошта') }}" required>
                    <input type="password" name="password" placeholder="{{ _('Пароль') }}" required>
                     {% if error and form_to_show == 'register' %}
                        <p class="error-message">{{ error }}</p>
                    {% endif %}
                    <button type="submit" class="big-btn">{{ _('Зареєструватися') }}</button>
                </form>

                <p style="margin-top: 20px;">
                    <a href="#" id="switch-to-register">{{ _('Немає акаунту? Зареєструйтесь') }}</a>
                    <a href="#" id="switch-to-login" style="display: none;">{{ _('Вже є акаунт? Увійдіть') }}</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const switchToRegister = document.getElementById('switch-to-register');
            const switchToLogin = document.getElementById('switch-to-login');
            const formTitle = document.getElementById('form-title');

            switchToRegister.addEventListener('click', function(e) {
                e.preventDefault();
                loginForm.style.display = 'none';
                registerForm.style.display = 'flex';
                switchToRegister.style.display = 'none';
                switchToLogin.style.display = 'inline';
                formTitle.innerText = '{{ _("Реєстрація") }}';
            });

            switchToLogin.addEventListener('click', function(e) {
                e.preventDefault();
                registerForm.style.display = 'none';
                loginForm.style.display = 'flex';
                switchToLogin.style.display = 'none';
                switchToRegister.style.display = 'inline';
                formTitle.innerText = '{{ _("Вхід") }}';
            });

            // If server-side validation fails, show the correct form
            {% if form_to_show == 'register' %}
                switchToRegister.click();
            {% endif %}
        });
    </script>
</body>
</html>
